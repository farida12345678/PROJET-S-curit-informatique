services:
  web:
    build: .
    ports:
      - "8085:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=secureblog_vuln
      - DB_USER=secureblog
      - DB_PASS=secureblog123

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: secureblog_vuln
      POSTGRES_USER: secureblog
      POSTGRES_PASSWORD: secureblog123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata: